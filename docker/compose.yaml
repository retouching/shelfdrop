# Every command runs from the repository root:
#   docker compose --env-file .env -f docker/compose.yaml up -d --build --wait
services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: shelfdrop-api:local
    restart: unless-stopped
    environment:
      SHELFDROP_CONTACT: ${SHELFDROP_CONTACT:?set SHELFDROP_CONTACT in .env}
      SHELFDROP_SECRET_KEY: ${SHELFDROP_SECRET_KEY:?set SHELFDROP_SECRET_KEY in .env}
      SHELFDROP_LOG_LEVEL: ${SHELFDROP_LOG_LEVEL:-INFO}
      # Imported once into the settings at the first start where they are set.
      SHELFDROP_JELLYFIN_URL: ${SHELFDROP_JELLYFIN_URL:-}
      SHELFDROP_MYANIMELIST_CLIENT_ID: ${SHELFDROP_MYANIMELIST_CLIENT_ID:-}
      SHELFDROP_PROWLARR_URL: ${SHELFDROP_PROWLARR_URL:-}
      SHELFDROP_PROWLARR_API_KEY: ${SHELFDROP_PROWLARR_API_KEY:-}
      SHELFDROP_DISCORD_WEBHOOK: ${SHELFDROP_DISCORD_WEBHOOK:-}
      # The address of the pages, linked by the messages of the journal.
      SHELFDROP_PUBLIC_URL: ${SHELFDROP_PUBLIC_URL:-}
      # The address of the reverse proxy, whose X-Forwarded-For uvicorn trusts.
      FORWARDED_ALLOW_IPS: ${SHELFDROP_PROXY_ADDRESS:-127.0.0.1}
    volumes:
      - data:/data/shelfdrop
    ports:
      - "127.0.0.1:${SHELFDROP_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The placement worker: the one process that writes in the libraries (ADR 0016). The same
  # image; the torrents and the libraries in one mount, so that a hardlink stays on one file
  # system; the database of the API under another path, so that nothing is mounted inside the
  # libraries.
  placement:
    image: shelfdrop-api:local
    restart: unless-stopped
    command: ["shelfdrop", "placement", "run"]
    # The user of the image, in the group that owns the torrents and the libraries: a hardlink
    # of a file of the torrent client needs to read and write it (fs.protected_hardlinks).
    user: "10001:${SHELFDROP_LIBRARY_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SHELFDROP_CONTACT: ${SHELFDROP_CONTACT:?set SHELFDROP_CONTACT in .env}
      SHELFDROP_SECRET_KEY: ${SHELFDROP_SECRET_KEY:?set SHELFDROP_SECRET_KEY in .env}
      SHELFDROP_LOG_LEVEL: ${SHELFDROP_LOG_LEVEL:-INFO}
      SHELFDROP_DATA_DIR: /var/lib/shelfdrop
    volumes:
      - data:/var/lib/shelfdrop
      - ${SHELFDROP_MEDIA_DIR:-../.data/media}:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
