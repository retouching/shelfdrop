# The test stack, over docker/compose.yaml; tests/integration alone starts it, one throwaway
# project `shelfdrop-test-<hex>` per pytest session:
#   docker compose -p <project> -f docker/compose.yaml -f docker/compose.test.yaml up -d --build --wait
# It reads no .env: tests/integration gives every variable Compose requires.
services:
  api:
    restart: "no"
    environment:
      SHELFDROP_LOG_LEVEL: INFO
      SHELFDROP_LOG_FORMAT: json
      # The settings reserved for the test stack (shelfdrop.config.TEST_STACK_SETTINGS): every
      # request to a metadata source goes to the fake sources, and a source that failed is not
      # skipped, so that no test disturbs the next one.
      SHELFDROP_SOURCES_ORIGIN: http://fake-sources:8080
      SHELFDROP_SOURCE_REST_SECONDS: "0"
      # A torrent sent to qBittorrent is looked for every second instead of 8, so that a send
      # not received fails in 2 seconds.
      SHELFDROP_SEND_CHECK_SECONDS: "1"
      # The events of one batch of the journal wait 2 seconds for the others instead of 30.
      SHELFDROP_JOURNAL_BATCH_SECONDS: "2"
      # A round of the waiting searches every second instead of every minute.
      SHELFDROP_WAITING_EVERY_SECONDS: "1"
      # The journal links its messages there.
      SHELFDROP_PUBLIC_URL: http://shelfdrop.test
      # Prowlarr is played by the fake sources too, with the answers of
      # tests/unit/releases/fixtures/prowlarr.json and the key of the tests, imported into the
      # settings at start.
      SHELFDROP_PROWLARR_URL: http://fake-sources:8080
      SHELFDROP_PROWLARR_API_KEY: test-prowlarr-key
      # Jellyfin too: the accounts of tests.integration.support.jellyfin_stubs sign in there.
      SHELFDROP_JELLYFIN_URL: http://fake-sources:8080
    ports: !override
      - "127.0.0.1::8000"
    networks:
      - default
      - sources
    depends_on:
      fake-sources:
        condition: service_healthy
      qbittorrent-lists:
        condition: service_healthy

  # A second API, for the set-up of the first launch alone (tests/integration/test_setup.py
  # starts it with `--profile setup`): a database of its own in memory, and neither Prowlarr
  # nor Jellyfin in its environment.
  api-setup:
    extends:
      file: compose.yaml
      service: api
    profiles: [setup]
    restart: "no"
    environment:
      SHELFDROP_LOG_LEVEL: INFO
      SHELFDROP_LOG_FORMAT: json
      SHELFDROP_SOURCES_ORIGIN: http://fake-sources:8080
      SHELFDROP_SOURCE_REST_SECONDS: "0"
      SHELFDROP_PROWLARR_URL: ""
      SHELFDROP_PROWLARR_API_KEY: ""
      SHELFDROP_JELLYFIN_URL: ""
    volumes: !override []
    tmpfs:
      - /data/shelfdrop:uid=10001,gid=10001,mode=0700
    ports: !override
      - "127.0.0.1::8000"
    networks:
      - default
      - sources
    depends_on:
      fake-sources:
        condition: service_healthy

  placement:
    restart: "no"
    environment:
      SHELFDROP_LOG_FORMAT: json
      # A round of the placement every second instead of 30.
      SHELFDROP_PLACEMENT_EVERY_SECONDS: "1"
      # The covers of the sources through the fake sources too.
      SHELFDROP_SOURCES_ORIGIN: http://fake-sources:8080
    # The fixture `media` makes the folders of the tests as root (`exec --user 0:0`): the capability
    # to give them to the user of the worker. The worker itself runs as 10001, without it.
    cap_add: [CHOWN, FOWNER]
    # The torrents and the libraries of the tests: a volume of their own, made by the tests.
    volumes: !override
      - data:/var/lib/shelfdrop
      - media:/data
    networks:
      - default
      - sources

  # The fake metadata sources, Prowlarr and Jellyfin: WireMock by digest, as its image ships it, in clear HTTP on 8080,
  # with no privilege, no capability and no volume. The tests load the recorded exchanges of
  # tests/unit/works/fixtures through its administration, which it publishes on the loopback.
  fake-sources:
    image: wiremock/wiremock@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    command: ["--port", "8080", "--disable-banner"]
    ports:
      - "127.0.0.1::8080"
    networks:
      - default
      - sources
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -o /dev/null http://localhost:8080/__admin/health"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # qBittorrent lists every torrent of `hashes=<a>|<b>`; WireMock answers with one stub alone. It
  # sends a list of several hashes here (tests/integration/qbittorrent_lists.py), which asks it
  # for each hash and joins the torrents. The Python of the image of the API, on the network
  # `sources` alone, with no privilege and no capability.
  qbittorrent-lists:
    image: shelfdrop-api:local
    restart: "no"
    command: ["python", "/fake/qbittorrent_lists.py"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ../tests/integration/qbittorrent_lists.py:/fake/qbittorrent_lists.py:ro
    networks:
      - sources
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # A real Deluge, for the connector `deluge` (tests/integration/test_torrent_deluge.py): the
  # linuxserver image by digest, its Web UI on 8112 (password `deluge`) on the network `sources`
  # alone, with no way out (no tracker, no DHT reached); the torrents in the volume of the
  # placement worker, written as its user and the group of the library.
  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0-ls384@sha256:bf306ddd5e6d4a85d3d05ce1b947ab6e344e7fca1b7740b77c58ce170118c7ff
    restart: "no"
    environment:
      PUID: "10001"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - media:/data
    networks:
      - sources
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -o /dev/null http://localhost:8112/"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

volumes:
  media:

networks:
  # Between the API and the fake sources alone, with no way out.
  sources:
    internal: true
