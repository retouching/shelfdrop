[project]
name = "shelfdrop"
version = "0.12.0"
description = "Find, download and shelve manga, books and audiobooks into Jellyfin."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "anyio>=4.15",
    "cryptography>=50.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54",
    "wireup>=2.12",
]

[project.scripts]
shelfdrop = "shelfdrop.cli.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "TID251", "SLF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF001", "S603", "S607"]
"shelfdrop/**/repository.py" = ["TID251"]
"shelfdrop/db/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.select".msg = "Queries live in a repository.py (ADR 0005)."
"sqlalchemy.func".msg = "Queries live in a repository.py (ADR 0005)."
"sqlalchemy.text".msg = "Queries live in a repository.py (ADR 0005)."
"sqlalchemy.insert".msg = "Queries live in a repository.py (ADR 0005)."
"sqlalchemy.update".msg = "Queries live in a repository.py (ADR 0005)."
"sqlalchemy.delete".msg = "Queries live in a repository.py (ADR 0005)."
"sqlite3".msg = "The database is reached through SQLAlchemy (ADR 0005)."

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["shelfdrop", "tests"]
exclude = ["^shelfdrop/db/migrations/versions/"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]
markers = [
    "security: integration part, the errors, the liveness probe, the headers, the logs, the migrations",
    "security_errors: block of security, the error bodies (test_errors.py)",
    "security_health: block of security, the liveness probe (test_health.py)",
    "security_headers: block of security, the response headers (test_http_headers.py)",
    "security_logging: block of security, the logs of the API (test_logging.py)",
    "security_migrations: block of security, the migrations and a restart (test_migrations.py)",
    "pages: integration part, the pages of the front-end (test_pages.py)",
    "works: integration part, the work search through the fake sources",
    "works_search: block of works, the recorded searches (test_work_search.py)",
    "works_sources: block of works, the failed sources, the cache, one run (test_work_sources.py)",
    "releases: integration part, the release search through the fake Prowlarr",
    "releases_search: block of releases, the search of a work under its names (test_release_search.py)",
    "releases_manual: block of releases, the manual search (test_release_manual.py)",
    "releases_jobs: block of releases, the shared searches, the queue, the cache, the events (test_release_jobs.py)",
    "releases_trackers: block of releases, the trackers read from Prowlarr (test_release_trackers.py)",
    "releases_filters: block of releases, the filters and the score (test_release_filters.py)",
    "works_merge: block of works, the works merged by hand, split (test_work_merge.py)",
    "works_names_language: block of works, the languages of the names, the checked ones (test_work_names.py)",
    "auth: integration part, the sign-in and the sessions through the fake Jellyfin",
    "auth_session: block of auth, the routes without a session, the origin, the sign-out (test_session.py)",
    "auth_setup: block of auth, the set-up of the first launch and the internal account (test_setup.py)",
    "auth_sign_in: block of auth, the sign-in, the refusals, the attempts counted (test_sign_in.py)",
    "settings: integration part, the settings, their secrets and the tests of the connections",
    "settings_store: block of settings, kept, audited, imported, read at each use (test_settings.py)",
    "settings_tests: block of settings, the tests of the connections (test_settings_tests.py)",
    "downloads: integration part, the downloads through the fake Prowlarr and qBittorrent",
    "downloads_send: block of downloads, the send, its hash, a duplicate, the automatic rules (test_download_send.py)",
    "downloads_follow: block of downloads, the figures of qBittorrent, the end (test_download_follow.py)",
    "downloads_retry: block of downloads, a torrent lost, sent again (test_download_retry.py)",
    "downloads_manual: block of downloads, a manual download, to place (test_download_manual.py)",
    "journal: integration part, the events posted on the fake webhook of Discord (test_journal.py)",
    "placement: integration part, the placement worker on the files of its volume",
    "library: integration part, the page Métadonnées on the fake Jellyfin (test_library.py)",
    "waiting: integration part, the waiting searches on the fake Prowlarr and Discord (test_waiting.py)",
    "placement_comics: block of placement, a manga placed, placed in part, a release in chapters (test_placement_comics.py)",
    "placement_audio: block of placement, MP3 tracks merged into one M4B, a book (test_placement_audio.py)",
    "uploads: integration part, the files sent in chunks, taken into Ranger (test_uploads.py)",
    "ranger: integration part, the page Ranger and the files the worker places from it",
    "ranger_link: block of ranger, a download left linked to a work, a name taken, a file corrected, a file ignored (test_ranger_link.py)",
    "ranger_chapters: block of ranger, a release in chapters merged into its volumes (test_ranger_chapters.py)",
    "ranger_scan: block of ranger, the scan of the files misplaced and its time (test_ranger_scan.py)",
    "access: integration part, the access tokens, the OpenAPI document and the MCP server",
    "access_tokens: block of access, the tokens created, scoped, counted, revoked (test_tokens.py)",
    "access_openapi: block of access, the OpenAPI document and its page (test_openapi.py)",
    "access_mcp: block of access, the MCP server called by a real client with a token (test_mcp.py)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-defusedxml>=0.7.0.20260504",
]
